[project]
name = "nedelsky-ai-maturity-quiz"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.6,<1", "jinja2>=3.1.6,<4", "uvicorn>=0.32.1,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
